name = "solquicks-points"
main = "src/index.js"
compatibility_date = "2025-09-23"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://solquicks.com,https://www.solquicks.com"
MOON_RANGERS_COLLECTION = "5QuB6vy8181PG9g9SiQD6U7TfvuF9hcP9tAjj5DH79oz"
# solquicks.skr, the Seeker hardware wallet. Public address, not a secret.
# Stored as the resolved ADDRESS rather than the domain on purpose: a domain can
# be transferred or repointed, and money must go somewhere fixed.
TREASURY_WALLET = "uPMPPQ3tEXWbAVaESSbERMHG9Yb2VvAq3XU6R5J8LUc"

# The soulbound collectible's Core collection, written by collectible/setup.mjs
# into collectible/cache.mainnet.json. Empty until the mint opens: while it is
# empty the store card says "opening soon" and no perks are granted.
COLLECTIBLE_COLLECTION = "GHhygKTrAoPzdFABab4SRErtTcZVfrbhxtpNDWJHLJwW"

# Flip to "true" at the mainnet cutover. Off-chain staking is a database row and
# the escrow vault is a real account; if both accept new positions the two
# records drift apart. This makes /api/stake refuse new positions while leaving
# unstake open, so anyone mid-position can still get out.
STAKING_ONCHAIN = "false"

# health check every 30 minutes; alerts only when the state changes
[triggers]
crons = ["*/30 * * * *"]

# The consulting hour is arranged by hand — Calendly's free plan allows one
# event type and the 30-minute link is using it — so the page asks for
# availability once the hour is paid for. No config is needed for that.
#
# If a scheduling link is ever wanted, set CONSULT_CALENDLY as a secret rather
# than a var here: it would be a secret-event link shown only to someone who has
# paid, and this file is in a public repo.
#
#   npx wrangler secret put CONSULT_CALENDLY
#
# With one set, the page offers it instead of asking when they are free.

[[d1_databases]]
binding = "DB"
database_name = "solquicks-points"
database_id = "5084c600-ba8a-4c19-96f6-e795ee8c92c3"

# Rate limits. Keyed by wallet where the caller is signed in, by IP otherwise.
# The scarce resource is Helius credits — the free tier allows only 2 DAS
# requests per second — so chain-reading routes are held well below that.

# sign-in: nonce + session. Ten a minute is generous for a human.
[[ratelimits]]
name = "RL_AUTH"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 10
  period = 60

# routes that call Helius: rangers, stake, img
[[ratelimits]]
name = "RL_CHAIN"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 20
  period = 60

# authenticated writes: visit, award, claim, unstake, migrate
[[ratelimits]]
name = "RL_WRITE"
namespace_id = "1003"
  [ratelimits.simple]
  limit = 30
  period = 60

# public reads: leaderboard
[[ratelimits]]
name = "RL_READ"
namespace_id = "1004"
  [ratelimits.simple]
  limit = 60
  period = 60
