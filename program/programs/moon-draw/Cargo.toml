[package]
name = "moon-draw"
version = "0.1.0"
description = "Verifiable quarterly mission draw for Moon Rangers"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "moon_draw"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "1.1.2"
ephemeral-rollups-sdk = { version = "0.17.0", features = ["anchor", "vrf"] }

[dev-dependencies]
litesvm = "0.16.0"
solana-address = "2.6"
solana-account = "4.3"
solana-keypair = "3.1"
solana-signer = "3.0"
solana-instruction = "3.4"
solana-message = "4.4"
solana-transaction = "4.1"
solana-system-interface = "2.0"
