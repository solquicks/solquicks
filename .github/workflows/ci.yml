name: CI

# Everything here already existed as checks somebody had to remember to run.
# This is what makes them run on their own, and gives the branch protection on
# main something real to gate on.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: nothing here writes to the repo.
permissions:
  contents: read

# A newer push makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Match the toolchain the program is actually developed against.
  SOLANA_VERSION: v3.1.10

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit, not a tag. A tag can be moved to point
      # at different code; a commit SHA cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Deliberately not a third-party scanning action: this runs on every push
      # and a scanner is exactly the kind of dependency worth not having. The
      # patterns below are the ones that would actually hurt this project.
      - name: Look for key material in tracked files
        run: |
          set -euo pipefail
          fail=0

          # A Solana keypair is 64 comma-separated bytes. One was committed to
          # this repo before, so this is the highest-value check here.
          if git ls-files -z | xargs -0 grep -lE '\[[[:space:]]*([0-9]{1,3}[[:space:]]*,[[:space:]]*){60,}[0-9]{1,3}[[:space:]]*\]' 2>/dev/null | grep -v node_modules; then
            echo "::error::A file looks like it contains a Solana keypair."
            fail=1
          fi

          if git ls-files -z | xargs -0 grep -lE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' 2>/dev/null; then
            echo "::error::A private key block is committed."
            fail=1
          fi

          # Each prefix below has a bracket inserted before its underscore. That
          # is invisible to the regex engine but means this line does not
          # contain the literal prefixes it searches for, so the scanner no
          # longer flags its own source. It did exactly that the first time it
          # ran, and then again on the comment explaining the fix.
          if git ls-files -z | xargs -0 grep -lE '(sk[_]live_|ghp[_]|github[_]pat_|xox[bp]-|AKIA[0-9A-Z]{16})' 2>/dev/null; then
            echo "::error::What looks like a provider API key is committed."
            fail=1
          fi

          # Secrets belong in wrangler secrets and gitignored files, never here.
          if git ls-files | grep -qE '(^|/)(uploader\.json|authority\.json|id\.json|\.dev\.vars|\.env(\.local|\.production|\.development)?|.*-keypair\.json)$'; then
            echo "::error::A secret-bearing filename is tracked by git."
            fail=1
          fi

          if [ "$fail" -eq 0 ]; then echo "No key material found in tracked files."; fi
          exit $fail

  program:
    name: Solana program
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache cargo and the Solana toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.local/share/solana
            program/target
          key: ${{ runner.os }}-solana-${{ env.SOLANA_VERSION }}-${{ hashFiles('program/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-solana-${{ env.SOLANA_VERSION }}-

      # Pinned to an exact release rather than "stable", so a toolchain change
      # is a commit here and not a surprise on a Tuesday.
      - name: Install the Solana toolchain
        run: |
          set -euo pipefail
          sh -c "$(curl -sSfL https://release.anza.xyz/${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Versions
        working-directory: program
        run: |
          solana --version
          cargo --version

      - name: Formatting
        working-directory: program
        run: cargo fmt --all --check

      # The lints that matter for on-chain code. A panic in a program is a
      # failed transaction at best; unchecked arithmetic is worse.
      - name: Clippy, with the on-chain lints
        working-directory: program
        run: |
          cargo clippy --all-targets -- \
            -W clippy::all \
            -W clippy::unwrap_used \
            -W clippy::expect_used \
            -W clippy::panic \
            -W clippy::arithmetic_side_effects

      # LiteSVM loads the built .so, so the tests cannot run without this.
      - name: Build
        working-directory: program
        run: cargo build-sbf

      - name: Tests
        working-directory: program
        run: cargo test --all

      - name: Audit dependencies
        working-directory: program
        continue-on-error: true # advisories in the Solana tree are not ours to fix
        run: |
          cargo install cargo-audit --locked --quiet || true
          cargo audit

  worker:
    name: Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The BUILD check below compares this branch's worker against main,
          # so the history has to be there to compare against.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Worker parses
        run: node --check worker/src/index.js

      # A changed Worker must carry a changed BUILD marker, because that marker
      # is the only way to tell a stale deploy from a current one. Two commits
      # in October changed the booking prices without touching it, the Worker
      # was never deployed, and /api/health reported a match while production
      # quoted the old prices for days.
      - name: Worker source changed means BUILD changed
        run: |
          git fetch --no-tags --depth=0 origin "${GITHUB_BASE_REF:-main}" 2>/dev/null || true
          node worker/test/build-bumped.mjs "origin/${GITHUB_BASE_REF:-main}"

      # Every env.X the Worker reads must be declared somewhere: a [vars] entry or
      # binding in wrangler.toml, or a secret listed in .dev.vars.example. A
      # setting in the wrong section fails silently in production.
      - name: Every setting the Worker reads is declared
        run: node worker/test/env-check.mjs

      # Runs the shipped verifyInvoice against nine payment shapes: exact,
      # overpaid and short USDC, SOL, wrong wallet, nothing received, not yet on
      # chain, and a replayed signature. No network, no dependencies.
      - name: Payment verification tests
        working-directory: worker
        run: node test/verify-invoice.test.mjs

      - name: Draw assertions
        working-directory: worker
        run: node test/draw.test.mjs

      # Booking prices, the rush surcharge and the holder discount — plus the
      # check that the breakdown shown on the payment screen adds up to the
      # amount the wallet is actually asked for.
      - name: Booking quote maths
        working-directory: worker
        run: node test/booking-quote.test.mjs

      # The real worker's booking and ad-slot checkouts against a real SQLite
      # database built from schema.sql, with a fake clock and a fake chain:
      # holds, expiry, double-booking, both ways of paying, late and replayed
      # payments, and the scheduled sweep. Needs node:sqlite, so Node 22.13+.
      - name: Booking and ad checkouts, end to end
        working-directory: worker
        run: node test/booking-api.test.mjs

      # Which swaps earn the fee and in which token, the Jupiter address in use,
      # wallet holdings across both token programs, and swap history.
      - name: Swap API
        working-directory: worker
        run: node test/swap-api.test.mjs

      # Traits, rarity ranking and the sales feed the Moon Rangers page reads.
      - name: Collection API
        working-directory: worker
        run: node test/collection.test.mjs

      # Deriving a fee account is elliptic-curve maths; it is checked against the
      # accounts Jupiter's own dashboard created.
      - name: Fee account derivation
        working-directory: worker
        run: node test/fee-derive.test.mjs

      # Who brought whom, what that earns, and the rule the whole thing rests
      # on: nothing is ever paid for a signup.
      - name: Invites
        working-directory: worker
        run: node test/invite.test.mjs

      # An invite, a name, a set of pages and a site at the end of it. Includes
      # the origin check every creator subdomain depends on.
      - name: Creator launchpad
        working-directory: worker
        run: node test/launch.test.mjs

      # Deposits, withdrawals and the measured savings rate. Written at the
      # same time as the Savings tab and never added here, so it has been
      # running only when somebody remembered to run it by hand.
      - name: Savings
        working-directory: worker
        run: node test/reflect.test.mjs

      # Buying several sessions at once. The price ladder is asserted as an
      # invariant — more sessions must never cost more each — because that is
      # exactly the mistake the first rate card made.
      - name: Bundles
        working-directory: worker
        run: node test/bundle.test.mjs

  site:
    name: Site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # index.html is one file with a large inline script. A syntax error in it
      # takes the whole site down, and nothing else here would catch it.
      - name: Inline script parses
        run: |
          node -e '
            const fs = require("fs");
            const vm = require("vm");
            const html = fs.readFileSync("index.html", "utf8");
            const blocks = [...html.matchAll(/<script([^>]*)>([\s\S]*?)<\/script>/g)];
            let n = 0, skipped = 0;
            for (const [, attrs, code] of blocks) {
              if (/\ssrc=/.test(attrs)) continue;                 // loaded, not inline
              const type = (attrs.match(/type="([^"]*)"/) || [])[1];
              // application/ld+json is structured data, not JavaScript
              if (type && !/^(text\/javascript|module)$/.test(type)) { skipped++; continue; }
              if (!code.trim()) continue;
              new vm.Script(code, { filename: "index.html inline #" + (++n) });
            }
            if (!n) { console.error("No inline JavaScript found — did the page change shape?"); process.exit(1); }
            console.log(n + " inline script block(s) parse, " + skipped + " non-JS block(s) skipped");
          '

      # The CDN scripts run on pages where people sign transactions. Losing the
      # integrity attribute would be silent and serious.
      - name: CDN scripts are pinned with integrity hashes
        run: |
          set -euo pipefail
          fail=0
          for f in index.html stake-init.html fees.html; do
            [ -f "$f" ] || continue
            while IFS= read -r line; do
              case "$line" in
                *integrity=*) ;;
                *) echo "::error file=$f::A cdn.jsdelivr.net script has no integrity attribute"; fail=1 ;;
              esac
            done < <(grep -o '<script src="https://cdn\.jsdelivr\.net[^>]*>' "$f" || true)
          done
          [ "$fail" -eq 0 ] && echo "Every CDN script carries an integrity hash."
          exit $fail

      # These break on anyone else's machine, including a fresh clone.
      - name: No machine-specific paths
        run: |
          if git grep -n "/Users/" -- '*.html' '*.mjs' '*.js' ':!*node_modules*' ':!*.lock'; then
            echo "::error::An absolute path from one developer's laptop is committed."
            exit 1
          fi
          echo "No absolute local paths."

      # Loads the page in Chromium and clicks through it the way a visitor would:
      # every tab, a swap quote, spam hiding in the token picker, and a normal and
      # a bot-protected swap with a stand-in wallet. The page's own security policy
      # is in force, so a connection it blocks fails here too.
      - name: Install the browser test
        working-directory: test/browser
        run: npm ci && npx playwright install --with-deps chromium

      - name: Site in a real browser
        working-directory: test/browser
        run: npm test

  # The site used to publish on every push to main, whether or not the checks
  # above passed — a push that failed CI still went live. Publishing from here
  # means a red check stops the deploy. Pages settings: Source = GitHub Actions.
  deploy:
    name: Deploy site
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [secrets, program, worker, site]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # A deploy that has started should finish, even if a newer push arrives.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # The same Jekyll build the branch-based Pages deploy ran, so the published
      # files are unchanged.
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./
          destination: ./_site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
