<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Games — solquicks.com</title>
  <meta name="description" content="Free browser games on solquicks.com. Play Moon Rangers FPS and earn Fox Points." />
  <meta property="og:title" content="Games — solquicks.com" />
  <meta property="og:description" content="Free browser games. Play and earn Fox Points." />
  <meta property="og:url" content="https://solquicks.com/games/" />
  <meta property="og:image" content="https://solquicks.com/games/moon-rangers/preview.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="675" />
  <meta property="og:image:alt" content="Moon Rangers FPS: the neon Moon City map, seen in-game" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="canonical" href="https://solquicks.com/games/" />
  <link rel="icon" href="/avatar.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #D9E4EB;
      --orange: #F0821E;
      --orange-deep: #d96a0a;
      --ink: #2E2440;
      --muted: #7A6E8A;
      --card: #fff;
      --line: #E2D9EF;
      --pop: 0 4px 24px rgba(46,36,64,0.10);
      --radius: 18px;
    }

    body {
      background: var(--bg);
      font-family: 'Nunito', sans-serif;
      color: var(--ink);
      min-height: 100vh;
    }

    header {
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.9rem;
      transition: color 0.15s;
    }

    .back-link:hover { color: var(--ink); }

    main {
      max-width: 880px;
      margin: 0 auto;
      padding: 8px 24px 60px;
    }

    .page-title {
      font-family: 'Baloo 2', sans-serif;
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--ink);
      margin-bottom: 6px;
    }

    .page-sub {
      color: var(--muted);
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 36px;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .game-card {
      background: var(--card);
      border-radius: var(--radius);
      border: 1.5px solid var(--line);
      box-shadow: var(--pop);
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .game-card:hover,
    .game-card:focus-visible {
      transform: translateY(-4px);
      border-color: var(--orange);
      box-shadow: 0 12px 36px rgba(240,130,30,0.22), 0 4px 24px rgba(46,36,64,0.10);
    }

    .game-card:focus-visible { outline: 3px solid var(--orange); outline-offset: 3px; }

    .game-thumb {
      width: 100%;
      aspect-ratio: 16/9;
      background: linear-gradient(135deg, #0a0a1a 0%, #1a1040 40%, #0d2040 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .game-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.45s ease, filter 0.45s ease;
    }

    /* soft fade at the bottom so the caption reads on any frame */
    .game-thumb::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(10,10,26,0.75) 0%, rgba(10,10,26,0) 45%);
      pointer-events: none;
    }

    .game-card:hover .game-thumb img,
    .game-card:focus-visible .game-thumb img {
      transform: scale(1.06);
      filter: saturate(1.15) brightness(1.05);
    }

    .game-thumb-caption {
      position: absolute;
      left: 12px;
      bottom: 10px;
      z-index: 1;
      color: #fff;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      opacity: 0.9;
    }

    .game-thumb-play {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 1;
      width: 58px;
      height: 58px;
      margin: -29px 0 0 -29px;
      border-radius: 50%;
      background: var(--orange);
      box-shadow: 0 6px 20px rgba(240,130,30,0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: scale(0.8);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .game-thumb-play::before {
      content: "";
      margin-left: 5px;
      border-left: 18px solid #fff;
      border-top: 11px solid transparent;
      border-bottom: 11px solid transparent;
    }

    .game-card:hover .game-thumb-play,
    .game-card:focus-visible .game-thumb-play { opacity: 1; transform: scale(1); }

    @media (hover: none) {
      .game-thumb-play { opacity: 0.92; transform: scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .game-card, .game-thumb img, .game-thumb-play { transition: none; }
      .game-card:hover, .game-card:focus-visible { transform: none; }
      .game-card:hover .game-thumb img, .game-card:focus-visible .game-thumb img { transform: none; }
    }

    .game-thumb-fallback {
      font-size: 3.5rem;
      filter: drop-shadow(0 0 16px #4af);
    }

    .game-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: var(--orange);
      color: #fff;
      font-family: 'Baloo 2', sans-serif;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 3px 9px;
      border-radius: 8px;
      z-index: 1;
    }

    .game-body {
      padding: 18px 20px 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .game-name {
      font-family: 'Baloo 2', sans-serif;
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--ink);
    }

    .game-desc {
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 700;
      line-height: 1.5;
      flex: 1;
    }

    .game-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 4px;
    }

    .game-tag {
      background: var(--bg);
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      padding: 3px 9px;
      border-radius: 8px;
      text-transform: uppercase;
    }

    .game-soon {
      margin-left: auto;
      font-weight: 800;
      font-size: 0.8rem;
      color: var(--orange-deep);
      text-align: right;
    }

    .play-btn {
      display: block;
      width: 100%;
      background: var(--orange);
      color: #fff;
      font-family: 'Baloo 2', sans-serif;
      font-size: 1rem;
      font-weight: 800;
      text-align: center;
      padding: 12px;
      border-radius: 0 0 var(--radius) var(--radius);
      letter-spacing: 0.04em;
      transition: background 0.1s;
    }

    .game-card:hover .play-btn { background: var(--orange-deep); }

    @media (max-width: 600px) {
      main { padding: 8px 16px 48px; }
      .page-title { font-size: 1.7rem; }
      .games-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <a class="back-link" href="/">← solquicks.com</a>
  </header>
  <main>
    <h1 class="page-title">Games</h1>
    <p class="page-sub">Play for free, earn Fox Points.</p>

    <div class="games-grid">
      <a class="game-card" href="/games/moon-rangers/">
        <div class="game-thumb">
          <img src="/games/moon-rangers/preview.webp" width="960" height="540" alt="In-game view of the neon Moon City map in Moon Rangers FPS" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" />
          <div class="game-thumb-fallback" style="display:none">🚀</div>
          <div class="game-badge">Free to play</div>
          <div class="game-thumb-play" aria-hidden="true"></div>
          <div class="game-thumb-caption">In-game · Moon City</div>
        </div>
        <div class="game-body">
          <div class="game-name">Moon Rangers FPS</div>
          <div class="game-desc">Hero shooter in your browser. Zero-G gunfights, 2 maps, 9 roles to pick from. No download needed. Play solo against bots today.</div>
          <div class="game-meta">
            <span class="game-tag">FPS</span>
            <span class="game-tag">vs bots</span>
            <span class="game-soon">Online 5v5 coming soon</span>
          </div>
        </div>
        <div class="play-btn">Play Now</div>
      </a>
    </div>
  </main>
</body>
</html>
